# THEME INJECTION: Woodfine Light
# Maps Woodfine Globals into the shared semantic alias schema (canvas/card/
# text/text_muted/border_heavy/border_hairline/accent/accent_hover) used
# across both brand theme files in this workspace family.
theme_name: "Woodfine Institutional Light"
color_scheme: "light"
inject:
  canvas: "{woodfine-canvas}"
  card: "{woodfine-white}"
  text: "{woodfine-slate}"
  text_muted: "{woodfine-grey-mid}"
  border_heavy: "{woodfine-slate}"
  border_hairline: "{woodfine-slate-translucent}"
  accent: "{woodfine-blue}"
  accent_hover: "{woodfine-grey-light}"
