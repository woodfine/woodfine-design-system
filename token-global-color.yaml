# GLOBAL TOKENS: Woodfine Proprietary Palette
colors:
  # Institutional brand spine
  woodfine-canvas: "#F7F9FA"
  woodfine-white: "#FFFFFF"
  woodfine-slate: "#111827"
  woodfine-slate-translucent: "rgba(17, 24, 39, 0.15)"
  woodfine-grey-mid: "#6B7280"
  woodfine-grey-light: "#e9ecef"
  woodfine-blue: "#164679"
  woodfine-blue-tint: "#E8EFF7"        # Woodfine Blue surface tint — Venn/chart bubble fill
  woodfine-black-pure: "#000000"

  # AEC semantic palette additions — small-step forward
  # Source: clones/project-bim/.agent/drafts-outbound/woodfine-palette-additions.md
  # Research: BB.13 (AEC color conventions), BB.14 (design-system pick), Sub-agent C (regulatory acceptance)
  # Master co-signed: 2026-05-06T19:10Z | Committed: 2026-05-07

  woodfine-amber: "#B54708"         # Regulation-warning / IDS validation alert
  woodfine-amber-bg: "#FFF8ED"      # Soft amber tint surface
  # woodfine-amber-tint removed 2026-07-30: was always the chart/org-chart entity role's soft
  # tint (not this AEC color's own), and that chart role itself renamed amber -> yellow on
  # 2026-06-06 (perceptual distance from orange insufficient) with its own woodfine-yellow-tint
  # below -- this entry was an orphaned leftover from before that rename, not a real second use
  # of the AEC amber. See docs/orgchart-brand-spec.md for the full history.

  woodfine-cyan: "#0E7490"          # MEP / systems-element indicator (IfcDistributionElement)
  woodfine-cyan-bg: "#ECFEFF"       # Soft cyan tint surface

  woodfine-error: "#B42318"         # Clash / IDS validation failure / regulation violation
  woodfine-error-bg: "#FEF3F2"      # Soft error tint surface

  # Renamed 2026-07-30 from woodfine-green -- disambiguates from the org-chart entity-role
  # green below (theme-woodfine.css's --wf-green, #198038), which is a genuinely different,
  # separately-approved color that happened to collide on the bare hue name. See
  # .agent/rules/design-tokens.md in project-design for the Carbon-model correction this
  # was found during.
  woodfine-status-verified: "#54924E"      # Verified/safe state — IDS pass, compliance ok (promoted from accent-secure in theme)
  woodfine-status-verified-bg: "#ECFDF3"   # Soft tint surface
  # woodfine-green-tint removed 2026-07-30: same orphaned-leftover reasoning as
  # woodfine-amber-tint above -- was the chart-green role's tint (wrong value, #EEF6EC vs the
  # real #DEFBE6 in theme-woodfine.css), not this AEC color's own.

  # Chart/org-chart palette — project-orgcharts
  woodfine-orange: "#F15F22"
  woodfine-orange-tint: "#FDE8DD"
  woodfine-gold: "#C89211"
  woodfine-gold-tint: "#FAEFCC"
  woodfine-purple: "#7C468C"
  woodfine-purple-tint: "#EEE6F1"

  # Org-chart palette additions — 2026-06-06
  # Source: project-orgcharts 9-chart production set (commit dabe5000)
  # Yellow updated 2026-06-06 from #F57F17 (perceptual distance from orange #F15F22 insufficient)
  woodfine-yellow: "#EAB308"         # Org-chart fund vehicle / LP — dashed pill connector color
  woodfine-yellow-tint: "#FFFDE7"    # Soft yellow surface for fund vehicle nodes
